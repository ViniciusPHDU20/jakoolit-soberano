# ==============================================================================
#  Soberano Fuzzel Launcher - Material You M3 Edition
#  Project: jakoolit-soberano
# ==============================================================================

# Cores geradas automaticamente pelo Matugen baseadas no Wallpaper ativo
# NOTA: include deve ficar no topo antes de qualquer section
include=~/.config/fuzzel/colors.ini

font=JetBrains Mono:weight=medium:size=12
dpi-aware=yes
prompt="Soberano > "
icon-theme=Papirus-Dark
icons-enabled=yes
show-actions=yes
terminal=kitty -e
width=40
lines=10
tabs=4
horizontal-pad=24
vertical-pad=18
inner-pad=12
image-size-ratio=0.5
line-height=24
letter-spacing=0.3
layer=overlay
exit-on-keyboard-focus-loss=yes

[border]
width=2
radius=16

[dmenu]
exit-immediately-if-empty=yes
