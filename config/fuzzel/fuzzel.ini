# ==============================================================================
#  Soberano Fuzzel Launcher - Material You M3 Edition
#  Project: jakoolit-soberano
# ==============================================================================

# Cores geradas automaticamente pelo Matugen baseadas no Wallpaper ativo
include = ~/.config/fuzzel/colors.ini

[main]
font = Plus Jakarta Sans:weight=medium:size=13
dpi-aware = yes
prompt = " ❯ "
icon-theme = Papirus-Dark
icons-enabled = yes
show-actions = yes
terminal = kitty -e
width = 38
lines = 9
tabs = 4
horizontal-pad = 24
vertical-pad = 18
inner-pad = 12
image-size-ratio = 0.5
line-height = 24
letter-spacing = 0.3
layer = overlay
exit-on-keyboard-focus-fail = yes

[border]
width = 2
radius = 16

[dmenu]
mode = index
exit-immediately-if-empty = yes
