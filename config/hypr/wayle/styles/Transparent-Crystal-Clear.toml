# ==============================================================================
#  Wayle Visual Style: Transparent-Crystal-Clear
#  Soberano Hyprland Ecosystem
# ==============================================================================

[styling]
scale = 1.0
rounding = "full"
theme-provider = "wayle"

[styling.palette]
bg = "#101018"
surface = "#181824"
elevated = "#202030"
fg = "#ffffff"
fg-muted = "#e0e0e0"
primary = "#80d8ff"
red = "#ff5252"
yellow = "#ffd740"
green = "#69f0ae"
blue = "#40c4ff"

[bar_style]
button-variant = "basic"
button-rounding = "full"
background-opacity = 15
border-location = "all"
border-width = 1
