[styling]
scale = 1.0
rounding = "none"
theme-provider = "wayle"

[styling.palette]
bg = "#282828"
surface = "#1d2021"
elevated = "#3c3836"
fg = "#ebdbb2"
fg-muted = "#a89984"
primary = "#fe8019"
red = "#fb4934"
yellow = "#fabd2f"
green = "#b8bb26"
blue = "#83a598"

[bar_style]
button-variant = "basic"
button-rounding = "none"
background-opacity = 96
border-location = "all"
border-width = 1
