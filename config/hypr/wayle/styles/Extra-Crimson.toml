# ==============================================================================
#  Wayle Visual Style: Extra-Crimson
#  Soberano Hyprland Ecosystem
# ==============================================================================

[styling]
scale = 1.0
rounding = "sm"
theme-provider = "wayle"

[styling.palette]
bg = "#1f0a0e"
surface = "#2d0f15"
elevated = "#3e151e"
fg = "#ffe4e8"
fg-muted = "#b87c88"
primary = "#ff3366"
red = "#ff1744"
yellow = "#ffb300"
green = "#00e676"
blue = "#00b0ff"

[bar_style]
button-variant = "block-prefix"
button-rounding = "sm"
background-opacity = 92
border-location = "all"
border-width = 1
