[styling]
scale = 1.0
rounding = "none"
theme-provider = "wayle"

[styling.palette]
bg = "#0a0a14"
surface = "#101026"
elevated = "#181838"
fg = "#00ffff"
fg-muted = "#00a3cc"
primary = "#00ffcc"
red = "#ff0055"
yellow = "#ffff00"
green = "#00ff66"
blue = "#00aaff"

[bar_style]
button-variant = "icon-square"
button-rounding = "none"
background-opacity = 95
border-location = "all"
border-width = 1
