# ==============================================================================
#  Wayle Visual Style: Catppuccin-Frappe
#  Soberano Hyprland Ecosystem
# ==============================================================================

[styling]
scale = 1.0
rounding = "sm"
theme-provider = "wayle"

[styling.palette]
bg = "#303446"
surface = "#292c3c"
elevated = "#414559"
fg = "#c6d0f5"
fg-muted = "#a5adce"
primary = "#ca9ee6"
red = "#e78284"
yellow = "#e5c890"
green = "#a6d189"
blue = "#8caaee"

[bar_style]
button-variant = "block-prefix"
button-rounding = "sm"
background-opacity = 88
border-location = "all"
border-width = 1
