# ==============================================================================
#  Wayle Layout Preset: BOT-Peony
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 0.5
inset-ends = 1.4
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "md"
shadow = "drop"
background-opacity = 88
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "media", "notifications", "systray"]
center = ["clock"]
right = ["battery", "brightness", "volume", "cpu", "network"]
