# ==============================================================================
#  Wayle Layout Preset: BOT-Sleek
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 0.25
inset-ends = 0.6
padding = 0.25
padding-ends = 0.4
module-gap = 0.4
rounding = "sm"
shadow = "none"
background-opacity = 95
border-location = "top"
border-width = 1
button-variant = "basic"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "hyprland-workspaces", "media", "systray"]
center = ["idle-inhibit", "clock", "notifications"]
right = ["window-title", "volume", "power"]
