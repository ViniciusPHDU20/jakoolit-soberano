# ==============================================================================
#  Wayle Layout Preset: LEFT-WestWing
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "left"
inset-edge = 0.5
inset-ends = 1.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "md"
shadow = "floating"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "power"]
