# ==============================================================================
#  Wayle Layout Preset: TOP-Default-old-v5
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.6
inset-ends = 1.2
padding = 0.35
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 85
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["cava", "media", "window-title"]
center = ["dashboard", "notifications", "hyprland-workspaces", "clock", "weather", "idle-inhibit"]
right = ["systray", "network", "battery", "cpu", "volume", "hyprsunset", "power"]
