# ==============================================================================
#  Wayle Layout Preset: TOP-Everforest
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 1.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "md"
shadow = "drop"
background-opacity = 92
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "notifications", "systray"]
center = ["clock", "idle-inhibit"]
right = ["cpu", "ram", "storage", "brightness", "battery", "volume", "hyprsunset", "power"]
