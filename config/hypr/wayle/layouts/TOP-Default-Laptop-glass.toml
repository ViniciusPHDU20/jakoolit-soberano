# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-glass
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.5
inset-ends = 1.4
padding = 0.3
padding-ends = 0.5
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 35
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
