# ==============================================================================
#  Wayle Layout Preset: TOP-Minimal-Long
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.6
inset-ends = 2.0
padding = 0.35
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 85
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "hyprland-workspaces", "media", "notifications", "systray"]
center = ["clock", "idle-inhibit"]
right = ["cpu", "battery", "volume", "hyprsunset", "power"]
