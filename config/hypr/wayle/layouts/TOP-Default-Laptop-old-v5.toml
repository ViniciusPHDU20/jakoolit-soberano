# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v5
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.5
inset-ends = 1.2
padding = 0.28
padding-ends = 0.5
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 85
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
