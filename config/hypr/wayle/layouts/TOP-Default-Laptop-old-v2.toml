# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v2
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 4.0
inset-ends = 8.0
padding = 0.25
padding-ends = 0.4
module-gap = 0.5
rounding = "sm"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
