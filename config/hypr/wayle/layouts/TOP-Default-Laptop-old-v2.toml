# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v2
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.3
inset-ends = 0.5
padding = 0.25
padding-ends = 0.4
module-gap = 0.4
rounding = "sm"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "power", "cpu", "battery", "weather"]
center = ["notifications", "cava", "clock", "hyprland-workspaces", "idle-inhibit"]
right = ["network", "systray", "media", "volume", "hyprsunset", "power"]
