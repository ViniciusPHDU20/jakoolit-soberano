# ==============================================================================
#  Wayle Layout Preset: TOP-Chrysanthemum
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.5
inset-ends = 1.2
padding = 0.38
padding-ends = 0.55
module-gap = 0.4
rounding = "lg"
shadow = "floating"
background-opacity = 82
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["clock", "media", "systray", "notifications"]
center = ["hyprland-workspaces"]
right = ["volume", "brightness", "battery", "hyprsunset", "power"]
