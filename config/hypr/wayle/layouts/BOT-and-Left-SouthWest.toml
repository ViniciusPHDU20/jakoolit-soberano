# ==============================================================================
#  Wayle Layout Preset: BOT-and-Left-SouthWest
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 6.0
inset-ends = 12.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "window-title"]
center = ["clock"]
right = ["volume", "power"]
