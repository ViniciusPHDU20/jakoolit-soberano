[bar]
location = "bottom"
inset-edge = 8.0
inset-ends = 60.0
padding = 0.38
padding-ends = 0.55
module-gap = 0.5
rounding = "lg"
shadow = "floating"
background-opacity = 85
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "cava"]
center = ["clock"]
right = ["volume", "battery", "power"]
