# ==============================================================================
# Wayle Layout Preset: TOP-Simpliest
# Crafted for jakoolit-soberano (Next-Gen Wayle + Matugen)
# ==============================================================================

[general]
font-sans = "Plus Jakarta Sans"
font-mono = "JetBrains Mono"

[bar]
location = "top"
scale = 1.0
exclusive = true
layer = "top"
bg = "bg-surface"
background-opacity = 88
rounding = "full"
border-location = "all"
border-width = 1
border-color = "border-accent"
module-gap = 0.6
padding = 0.2
padding-ends = 0.8
button-rounding = "full"

[styling]
scale = 1.0
rounding = "full"
theme-provider = "matugen"

[[bar.layout]]
monitor = "*"
show = true
left = ["media"]
center = ["hyprland-workspaces", "clock"]
right = ["volume", "network", "power"]
