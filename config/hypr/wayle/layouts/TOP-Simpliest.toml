# ==============================================================================
#  Wayle Layout Preset: TOP-Simpliest
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.6
inset-ends = 4.5
padding = 0.3
padding-ends = 0.5
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 85
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "systray", "media"]
center = ["window-title"]
right = ["idle-inhibit", "clock", "hyprsunset", "power"]
