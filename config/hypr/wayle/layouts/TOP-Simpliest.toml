[bar]
location = "top"
inset-edge = 6.0
inset-ends = 320.0
padding = 0.3
padding-ends = 0.5
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 85
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["power"]
