# ==============================================================================
#  Wayle Layout Preset: LEFT-WestWing-v2
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "left"
inset-edge = 0.6
inset-ends = 1.5
padding = 0.4
padding-ends = 0.6
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 82
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["media", "volume", "power"]
