# ==============================================================================
#  Wayle Layout Preset: TOP-Default-old-v4
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 6.0
inset-ends = 16.0
padding = 0.3
padding-ends = 0.5
module-gap = 0.5
rounding = "lg"
shadow = "floating"
background-opacity = 88
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["window-title"]
right = ["cava", "volume", "clock", "power"]
