# ==============================================================================
#  Wayle Layout Preset: TOP-Default-old-v4
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.5
inset-ends = 1.0
padding = 0.3
padding-ends = 0.5
module-gap = 0.4
rounding = "lg"
shadow = "floating"
background-opacity = 88
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "cpu", "weather"]
center = ["notifications", "cava", "clock", "hyprland-workspaces", "idle-inhibit"]
right = ["network", "systray", "media", "volume", "hyprsunset", "power"]
