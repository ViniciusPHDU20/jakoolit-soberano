# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v1
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.0
inset-ends = 0.0
padding = 0.25
padding-ends = 0.4
module-gap = 0.5
rounding = "none"
shadow = "none"
background-opacity = 95
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
