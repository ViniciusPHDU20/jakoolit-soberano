[bar]
location = "top"
inset-edge = 0.25
inset-ends = 0.6
padding = 0.25
padding-ends = 0.4
module-gap = 0.5
rounding = "sm"
shadow = "none"
background-opacity = 95
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "window-title"]
center = ["clock"]
right = ["volume", "power"]
