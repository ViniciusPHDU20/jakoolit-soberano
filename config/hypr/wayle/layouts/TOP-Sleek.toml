# ==============================================================================
#  Wayle Layout Preset: TOP-Sleek
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.2
inset-ends = 0.5
padding = 0.22
padding-ends = 0.4
module-gap = 0.4
rounding = "sm"
shadow = "none"
background-opacity = 95
border-location = "bottom"
border-width = 1
button-variant = "basic"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "hyprland-workspaces", "media", "systray"]
center = ["idle-inhibit", "clock", "notifications"]
right = ["window-title", "volume", "cpu", "hyprsunset", "power"]
