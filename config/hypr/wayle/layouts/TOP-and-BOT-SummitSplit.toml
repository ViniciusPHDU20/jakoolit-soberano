# ==============================================================================
# Wayle Layout Preset: TOP-and-BOT-SummitSplit
# Crafted for jakoolit-soberano (Next-Gen Wayle + Matugen)
# ==============================================================================

[general]
font-sans = "Plus Jakarta Sans"
font-mono = "JetBrains Mono"

[bar]
location = "top"
scale = 1.0
exclusive = true
layer = "top"
bg = "bg-surface"
background-opacity = 96
rounding = "sm"
border-location = "bottom"
border-width = 1
border-color = "border-accent"
module-gap = 0.4
padding = 0.3
padding-ends = 0.5
button-rounding = "sm"

[styling]
scale = 1.0
rounding = "sm"
theme-provider = "matugen"

[[bar.layout]]
monitor = "*"
show = true
left = ["dashboard", "cava", "media", "window-title"]
center = ["hyprland-workspaces", "clock"]
right = ["network", "volume", "microphone", "notifications", "systray", "power"]
