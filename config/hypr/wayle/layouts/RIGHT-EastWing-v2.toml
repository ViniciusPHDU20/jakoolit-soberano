# ==============================================================================
#  Wayle Layout Preset: RIGHT-EastWing-v2
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "right"
inset-edge = 10.0
inset-ends = 24.0
padding = 0.4
padding-ends = 0.6
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 82
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["media", "volume", "power"]
