# ==============================================================================
# Wayle Layout Preset: RIGHT-EastWing-v2
# Crafted for jakoolit-soberano (Next-Gen Wayle + Matugen)
# ==============================================================================

[general]
font-sans = "Plus Jakarta Sans"
font-mono = "JetBrains Mono"

[bar]
location = "right"
scale = 1.0
exclusive = true
layer = "top"
bg = "bg-surface"
background-opacity = 96
rounding = "sm"
border-location = "top"
border-width = 1
border-color = "border-accent"
module-gap = 0.4
padding = 0.3
padding-ends = 0.5
button-rounding = "sm"

[styling]
scale = 1.0
rounding = "sm"
theme-provider = "matugen"

[[bar.layout]]
monitor = "*"
show = true
left = ["dashboard", "clock"]
center = ["hyprland-workspaces"]
right = ["volume", "network", "power"]
