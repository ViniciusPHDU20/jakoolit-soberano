# ==============================================================================
# Wayle Layout Preset: [TOP & BOT] SummitSplit v3
# Automatically converted from JaKooLit Waybar config
# Project: jakoolit-soberano (Next-Gen Wayle + Matugen)
# ==============================================================================
# [Dual-Surface Companion]
# This was a multi-bar preset in JaKooLit. The companion bottom bar layout:
# bottom_left = ["window-title", "cava", "media"]
# bottom_center = ["hyprland-submap", "window-title"]
# bottom_right = ["updates"]


[bar]
location = "top"
scale = 1.0
exclusive = true
bg = "bg-surface"
background-opacity = 96
rounding = "sm"
border-location = "all"
border-width = 1
border-color = "border-accent"
module-gap = 0.4
padding = 0.2
padding-ends = 0.4

[styling]
scale = 1.0
rounding = "sm"
theme-provider = "matugen"

[[bar.layout]]
monitor = "*"
show = true
left = [
    { name = "left-group", modules = ["systray", "clock", "network"] }
]
center = [
    { name = "center-group", modules = ["hyprland-submap", "hyprland-workspaces", "notifications"] }
]
right = [
    { name = "right-group", modules = ["media"] }
]
