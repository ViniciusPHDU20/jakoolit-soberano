# ==============================================================================
#  Wayle Layout Preset: TOP-and-BOT-SummitSplit-v3
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.6
inset-ends = 1.8
padding = 0.4
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 80
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["idle-inhibit", "systray", "clock", "network"]
center = ["dashboard", "hyprland-workspaces", "notifications"]
right = ["battery", "cpu", "volume", "media", "hyprsunset", "power"]
