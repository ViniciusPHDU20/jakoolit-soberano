# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v4
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 1.0
padding = 0.25
padding-ends = 0.4
module-gap = 0.5
rounding = "lg"
shadow = "floating"
background-opacity = 88
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
