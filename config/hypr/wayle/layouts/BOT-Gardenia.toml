[bar]
location = "bottom"
inset-edge = 12.0
inset-ends = 120.0
padding = 0.4
padding-ends = 0.6
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 75
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["cava", "volume", "power"]
