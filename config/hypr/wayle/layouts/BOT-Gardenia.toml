# ==============================================================================
#  Wayle Layout Preset: BOT-Gardenia
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 0.7
inset-ends = 2.2
padding = 0.4
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 75
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["clock", "media", "systray", "notifications"]
center = ["hyprland-workspaces"]
right = ["volume", "brightness", "power", "battery"]
