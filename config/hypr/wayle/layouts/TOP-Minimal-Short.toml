# ==============================================================================
#  Wayle Layout Preset: TOP-Minimal-Short
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.6
inset-ends = 3.5
padding = 0.35
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 88
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["clock", "weather"]
center = ["hyprland-workspaces"]
right = ["dashboard", "systray", "notifications", "media", "network", "brightness", "volume", "battery", "power"]
