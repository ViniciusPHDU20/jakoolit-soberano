# ==============================================================================
#  Wayle Layout Preset: TOP-Camellia
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 8.0
inset-ends = 36.0
padding = 0.4
padding-ends = 0.6
module-gap = 0.5
rounding = "full"
shadow = "floating"
background-opacity = 80
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["window-title"]
right = ["media", "volume", "clock", "power"]
