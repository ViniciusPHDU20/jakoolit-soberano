# ==============================================================================
#  Wayle Layout Preset: TOP-ddubs-simple-bar
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 4.0
inset-ends = 10.0
padding = 0.3
padding-ends = 0.5
module-gap = 0.5
rounding = "sm"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["window-title"]
right = ["clock", "volume", "power"]
