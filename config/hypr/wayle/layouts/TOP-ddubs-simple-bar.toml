# ==============================================================================
#  Wayle Layout Preset: TOP-ddubs-simple-bar
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.3
inset-ends = 0.7
padding = 0.3
padding-ends = 0.5
module-gap = 0.4
rounding = "sm"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["cava", "media", "window-title"]
center = ["hyprland-workspaces", "clock", "idle-inhibit"]
right = ["volume", "systray", "weather", "cpu", "ram", "battery", "power"]
