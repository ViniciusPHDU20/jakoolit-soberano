# ==============================================================================
#  Wayle Layout Preset: TOP-and-BOT-SummitSplit-v2
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 0.6
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "clock", "bluetooth", "network"]
center = ["window-title"]
right = ["media", "battery", "brightness", "volume", "cpu", "idle-inhibit", "hyprsunset", "power"]
