# ==============================================================================
#  Wayle Layout Preset: TOP-and-BOT-SummitSplit-v2
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 0.6
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "cava"]
center = ["window-title"]
right = ["clock", "volume", "power"]
