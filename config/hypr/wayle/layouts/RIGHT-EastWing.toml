# ==============================================================================
#  Wayle Layout Preset: RIGHT-EastWing
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "right"
inset-edge = 0.5
inset-ends = 1.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "md"
shadow = "floating"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["clock"]
center = ["idle-inhibit", "hyprland-workspaces"]
right = ["media", "systray", "notifications", "brightness", "volume", "hyprsunset", "power", "dashboard"]
