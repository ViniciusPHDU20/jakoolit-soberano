# ==============================================================================
#  Wayle Layout Preset: TOP-Everforest-glass
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.7
inset-ends = 2.5
padding = 0.4
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 25
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "notifications", "systray"]
center = ["clock", "idle-inhibit"]
right = ["cpu", "ram", "storage", "brightness", "battery", "volume", "hyprsunset", "power"]
