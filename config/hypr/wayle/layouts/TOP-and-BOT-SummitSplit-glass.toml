# ==============================================================================
#  Wayle Layout Preset: TOP-and-BOT-SummitSplit-glass
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.6
inset-ends = 1.8
padding = 0.4
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 25
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["cpu", "power", "ram", "storage"]
center = ["idle-inhibit", "clock"]
right = ["weather", "battery", "brightness", "bluetooth", "network", "hyprsunset", "power"]
