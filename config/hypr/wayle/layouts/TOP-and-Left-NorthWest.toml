# ==============================================================================
#  Wayle Layout Preset: TOP-and-Left-NorthWest
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 0.8
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "cpu", "ram"]
center = ["hyprland-workspaces"]
right = ["network", "bluetooth", "weather", "volume", "power"]
