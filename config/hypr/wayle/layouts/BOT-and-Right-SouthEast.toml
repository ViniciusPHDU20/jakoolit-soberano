# ==============================================================================
# Wayle Layout Preset: BOT-&-Right-SouthEast
# Automatically converted from JaKooLit Waybar config
# Project: jakoolit-soberano (Next-Gen Wayle + Matugen)
# ==============================================================================
# [Dual-Surface Companion]
# This was a multi-bar preset in JaKooLit. The companion bottom bar layout:
# bottom_left = ["power"]
# bottom_center = ["hyprland-submap", "clock"]
# bottom_right = ["media", "notifications", "systray"]


[bar]
location = "bottom"
scale = 1.0
exclusive = true
bg = "bg-surface"
background-opacity = 96
rounding = "sm"
border-location = "all"
border-width = 1
border-color = "border-accent"
module-gap = 0.4
padding = 0.2
padding-ends = 0.4

[styling]
scale = 1.0
rounding = "sm"
theme-provider = "matugen"

[[bar.layout]]
monitor = "*"
show = true
left = [
    { name = "left-group", modules = ["cpu", "temperature", "memory", "disk"] }
]
center = [
    { name = "center-group", modules = ["hyprland-submap", "hyprland-workspaces"] }
]
right = [
    { name = "right-group", modules = ["battery", "volume", "microphone", "power"] }
]
