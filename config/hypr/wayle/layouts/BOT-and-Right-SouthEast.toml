# ==============================================================================
#  Wayle Layout Preset: BOT-and-Right-SouthEast
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 0.4
inset-ends = 0.8
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["cava", "media", "volume", "power"]
