# ==============================================================================
#  Wayle Layout Preset: BOT-and-Right-SouthEast
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 0.4
inset-ends = 0.8
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "cpu", "ram", "storage"]
center = ["hyprland-workspaces"]
right = ["weather", "battery", "brightness", "volume", "power", "hyprsunset"]
