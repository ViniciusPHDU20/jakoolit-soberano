# ==============================================================================
#  Wayle Layout Preset: TOP-Default
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.0
inset-ends = 0.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "none"
shadow = "none"
background-opacity = 100
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "window-title"]
center = ["clock"]
right = ["cava", "media", "volume", "power"]
