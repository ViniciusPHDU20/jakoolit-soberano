# ==============================================================================
#  Wayle Layout Preset: BOT-Default
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "bottom"
inset-edge = 0.0
inset-ends = 0.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.4
rounding = "none"
shadow = "none"
background-opacity = 100
border-location = "top"
border-width = 1
button-variant = "block-prefix"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["cava", "media", "window-title"]
center = ["dashboard", "notifications", "hyprland-workspaces", "clock", "weather", "idle-inhibit"]
right = ["systray", "network", "cpu", "volume", "power"]
