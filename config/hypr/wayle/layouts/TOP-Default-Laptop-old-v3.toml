# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v3
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 0.8
padding = 0.28
padding-ends = 0.45
module-gap = 0.5
rounding = "md"
shadow = "drop"
background-opacity = 92
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
