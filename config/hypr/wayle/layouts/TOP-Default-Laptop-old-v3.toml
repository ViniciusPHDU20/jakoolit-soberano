# ==============================================================================
#  Wayle Layout Preset: TOP-Default-Laptop-old-v3
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 0.8
padding = 0.28
padding-ends = 0.45
module-gap = 0.4
rounding = "md"
shadow = "drop"
background-opacity = 92
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "power", "cpu", "battery", "weather"]
center = ["notifications", "cava", "clock", "hyprland-workspaces", "idle-inhibit"]
right = ["network", "systray", "media", "volume", "hyprsunset", "power"]
