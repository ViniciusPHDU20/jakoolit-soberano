# ==============================================================================
#  Wayle Layout Preset: TOP-0-Ja-0
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.5
inset-ends = 1.5
padding = 0.35
padding-ends = 0.6
module-gap = 0.4
rounding = "full"
shadow = "floating"
background-opacity = 82
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "full"

[[bar.layout]]
monitor = "*"
left = ["idle-inhibit", "systray", "clock", "window-title"]
center = ["dashboard", "hyprland-workspaces", "notifications"]
right = ["battery", "cpu", "volume", "media", "hyprsunset", "power"]
