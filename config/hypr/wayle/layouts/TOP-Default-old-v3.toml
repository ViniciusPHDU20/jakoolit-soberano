# ==============================================================================
#  Wayle Layout Preset: TOP-Default-old-v3
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 6.0
inset-ends = 12.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "md"
shadow = "drop"
background-opacity = 92
border-location = "all"
border-width = 1
button-variant = "icon-square"
button-rounding = "md"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock", "media"]
right = ["volume", "power"]
