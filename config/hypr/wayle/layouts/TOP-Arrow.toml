# ==============================================================================
#  Wayle Layout Preset: TOP-Arrow
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.0
inset-ends = 0.0
padding = 0.3
padding-ends = 0.4
module-gap = 0.5
rounding = "none"
shadow = "none"
background-opacity = 100
border-location = "all"
border-width = 1
button-variant = "block-prefix"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["window-title"]
right = ["volume", "clock", "power"]
