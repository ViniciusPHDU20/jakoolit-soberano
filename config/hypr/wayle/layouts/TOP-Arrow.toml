# ==============================================================================
#  Wayle Layout Preset: TOP-Arrow
#  Authentic JaKooLit-Soberano Port
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.0
inset-ends = 0.0
padding = 0.3
padding-ends = 0.4
module-gap = 0.4
rounding = "none"
shadow = "none"
background-opacity = 100
border-location = "bottom"
border-width = 2
button-variant = "basic"
button-rounding = "none"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces", "window-title"]
center = []
right = ["volume", "network", "ram", "cpu", "battery", "systray", "hyprsunset", "clock"]
