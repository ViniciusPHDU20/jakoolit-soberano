# ==============================================================================
#  Wayle Layout Preset: TOP-Simple
#  Soberano Hyprland Ecosystem
# ==============================================================================

[bar]
location = "top"
inset-edge = 0.4
inset-ends = 1.0
padding = 0.35
padding-ends = 0.5
module-gap = 0.5
rounding = "md"
shadow = "drop"
background-opacity = 90
border-location = "all"
border-width = 1
button-variant = "basic"
button-rounding = "sm"

[[bar.layout]]
monitor = "*"
left = ["hyprland-workspaces"]
center = ["clock"]
right = ["volume", "battery", "power"]
